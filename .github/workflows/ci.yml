name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # 테스트는 H2로 돈다. 동시 참여 테스트(MySQL 컨테이너)는 M4에서 따로 추가한다.
      - name: 빌드와 테스트
        run: ./gradlew build
